<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fable-omega-fifteen-hub-matrix-title fable-omega-fifteen-hub-matrix-desc" width="100%" height="auto" viewBox="0 0 1200 630" preserveAspectRatio="xMidYMid meet">
  <title id="fable-omega-fifteen-hub-matrix-title">FABLE OMEGA fifteen-hub matrix</title>
