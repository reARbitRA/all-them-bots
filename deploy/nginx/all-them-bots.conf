# ==============================================================================
# FABLE-OMEGA: Nginx Reverse Proxy & Webhook Multiplexer Configuration
# Handles SSL termination, Gzip/Brotli compression, and rate limiting
# ==============================================================================

upstream fable_bot_cluster {
    server 127.0.0.1:8000 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

# Rate limiting zone for Telegram Webhooks (100 req/s with burst)
limit_req_zone $binary_remote_addr zone=telegram_webhook_limit:10m rate=100r/s;

server {
    listen 80;
    server_name bots.yourdomain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name bots.yourdomain.com;

    # SSL Certificates (Replace with your actual Certbot / Cloudflare paths)
    ssl_certificate /etc/letsencrypt/live/bots.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bots.yourdomain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Performance buffers
    client_max_body_size 20M;
    client_body_buffer_size 128k;

    # Webhook multiplexer route
    location /webhook/ {
        limit_req zone=telegram_webhook_limit burst=50 nodelay;
        proxy_pass http://fable_bot_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API & Dashboard
    location / {
        proxy_pass http://fable_bot_cluster;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
